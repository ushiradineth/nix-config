# Leader Key
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Options
set -g mouse on                   # enable mouse support
set -g base-index 1               # start indexing windows at 1 instead of 0
setw -g pane-base-index 1         # start indexing panes at 1 instead of 0
set-option -g renumber-windows on # renumber all windows when any window is closed
set -g detach-on-destroy on       # exit from tmux when closing a session
set -sg escape-time 0             # shorten command delay
set -g history-limit 1000000      # increase history size (from 2,000)
set -g set-clipboard on           # use system clipboard
set -g allow-passthrough on       # allow OSC passthrough (Ghostty notifications)
setw -g mode-keys vi              # use vi keys
setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}'

# The suffix maps each tmux client to one native Ghostty surface.
set -g set-titles on
set -g set-titles-string '#{session_name} · #{window_name} [tmux:#{pid}:#{client_pid}]'

# Keybinds and Colors
set-option -g xterm-keys on
set -g default-terminal "xterm-256color"
set -as terminal-overrides ",*:Tc"

# Quiet
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Status bar
set -g status-position bottom # Set status bar position to bottom
set -g status-bg default # Set status bar color to transparent
set -g status-style bg=default # Set status bar color to transparent
set -g window-status-format "#[fg=#C9C9C9]#I:#W #[default]" # Format every window as “index:window ”
set -g window-status-current-format "#[fg=#FFFFFF,bold]#I:#W #[default]" # Highlight the current window
set -g status-left "#[fg=#FF95B5,bold]#S #[default]" # Full session name (#S)
set -g status-left-length 100 # Set status bar length to 100, necessary for long session names
if -F '#{==:#{@codex_quota_visible},}' 'set -g @codex_quota_visible 1'
set -g status-right '#{?@codex_quota_visible,#(codex-quota status),}#{?#{>:#{@opencode_terminal_attention},0},#{?@codex_quota_visible, ,}#[fg=##FF95B5#,bold]OC:#{@opencode_terminal_attention}#[default],}'
set -g status-right-length 80
set -g pane-border-style "fg=#FFFFFF"
set -g pane-active-border-style "fg=#FF95B5"
set -g pane-border-status off
set -g pane-border-format ''

# ---

# Keybinds

# Set leader + r to refresh tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Keep lowercase q available for pane numbers.
bind Q if -F '#{@codex_quota_visible}' 'set -g @codex_quota_visible 0' 'set -g @codex_quota_visible 1'

# Open new pane using ^ and % in the current path
unbind '"'
unbind ^
unbind %
bind ^ split-window -h -c "#{pane_current_path}"
bind % split-window -v -c "#{pane_current_path}"

# Open new window in the current path
unbind t
bind t new-window -c "#{pane_current_path}"

# Kill pane
unbind-key -n x
bind-key x kill-pane

# Kill window
unbind-key -n c
bind-key c kill-window

# Sessionizer: fuzzy find and switch to project session
unbind f
# Popup commands do not expand formats; expand once before passing direct argv.
bind f run-shell -C 'display-popup -c #{q:client_name} -EE -w 85% -h 65% tmux-navigation projects --client #{q:client_name} --socket #{q:socket_path}'
bind s run-shell -C 'display-popup -c #{q:client_name} -EE -w 85% -h 65% tmux-navigation sessions --client #{q:client_name} --socket #{q:socket_path}'
bind S choose-tree -Zs -K '#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|==:#{line},9},0,#{?#{e|<:#{line},36},M-#{a:#{e|+:97,#{e|-:#{line},10}}},}}}'

# OpenCode attention never sends input or approves requests.
bind i run-shell -C 'display-popup -c #{q:client_name} -E -w 85% -h 65% opencode-terminal inbox --client #{q:client_name}'
bind o run-shell 'opencode-terminal oldest --client "#{client_name}"'
set-hook -g 'after-select-pane[91]' 'run-shell -b "opencode-terminal refresh"'
set-hook -g 'after-select-window[91]' 'run-shell -b "opencode-terminal refresh"'
set-hook -g 'client-focus-in[91]' 'run-shell -b "opencode-terminal refresh"'

# Fix scrolling within TUIs like k9s
bind -n WheelUpPane if -F '#{alternate_on}' 'send-keys Up' 'if -F "#{mouse_any_flag}" "send -M" "copy-mode -e; send-keys -M"'
bind -n WheelDownPane if -F '#{alternate_on}' 'send-keys Down' 'send-keys -M'

# ---
